events {
    worker_connections 1024;
}

http {
    # Load balancing with multiple backend instances
    upstream golf_cms_api {
        least_conn;
        server golf-cms-api-1:8000 max_fails=3 fail_timeout=30s;
        server golf-cms-api-2:8000 max_fails=3 fail_timeout=30s;
        server golf-cms-api-3:8000 max_fails=3 fail_timeout=30s backup;
    }

    # Connection pooling and keepalive
    upstream golf_cms_api {
        least_conn;
        server golf-cms-api-1:8000 max_fails=3 fail_timeout=30s;
        server golf-cms-api-2:8000 max_fails=3 fail_timeout=30s;
        server golf-cms-api-3:8000 max_fails=3 fail_timeout=30s backup;
        keepalive 32;
    }

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;

    server {
        listen 80;
        server_name localhost;

        # API routes
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://golf_cms_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth routes with stricter rate limiting
        location /auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://golf_cms_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Admin routes
        location /admin/ {
            limit_req zone=api burst=15 nodelay;
            proxy_pass http://golf_cms_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Monitoring endpoints
        location /monitoring/ {
            proxy_pass http://golf_cms_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check
        location /healthz {
            proxy_pass http://golf_cms_api;
            access_log off;
        }

        # Static files and uploads
        location /uploads/ {
            proxy_pass http://golf_cms_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default route
        location / {
            proxy_pass http://golf_cms_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
